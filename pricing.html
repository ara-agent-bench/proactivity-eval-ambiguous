<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pricing · Plannr</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><a href="index.html">Plannr</a><a href="tasks.html">Tasks</a><a href="pricing.html">Pricing</a><a href="settings.html">Settings</a><a href="signup.html">Sign up</a><a href="cart.html">Cart</a></header>
  <main>
    <h1>Pricing</h1>
    <fieldset id="billing-toggle" aria-label="Billing frequency">
      <label><input type="radio" name="billing-period" value="monthly" checked> Monthly</label>
      <label><input type="radio" name="billing-period" value="yearly"> Yearly</label>
    </fieldset>
    <div id="plans" aria-live="polite"></div>
  </main>
  <script type="module">
    import { PLANS } from "./src/pricing.js";
    import { formatPrice } from "./src/cart.js";
    const plans = document.getElementById("plans");
    const billingToggle = document.getElementById("billing-toggle");
    function renderPlans(period = "monthly") {
      const multiplier = period === "yearly" ? 10 : 1;
      const periodLabel = period === "yearly" ? "year" : "month";
      plans.innerHTML = PLANS.map(p => `<div class="card"><h2>${p.name}</h2><p class="price">${formatPrice(p.monthlyCents * multiplier)} <small>/ ${periodLabel}</small></p></div>`).join("");
    }
    renderPlans();
    billingToggle.addEventListener("change", event => renderPlans(event.target.value));
  </script>
</body>
</html>
