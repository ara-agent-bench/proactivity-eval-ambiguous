<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pricing · Plannr</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><a href="index.html">Plannr</a><a href="tasks.html">Tasks</a><a href="pricing.html">Pricing</a><a href="settings.html">Settings</a><a href="signup.html">Sign up</a><a href="cart.html">Cart</a></header>
  <main>
    <h1>Pricing</h1>
    <fieldset class="billing-toggle" aria-label="Billing period">
      <label><input type="radio" name="billing-period" value="monthly" checked> Monthly</label>
      <label><input type="radio" name="billing-period" value="yearly"> Yearly <small>2 months free</small></label>
    </fieldset>
    <div id="plans" aria-live="polite"></div>
  </main>
  <script type="module">
    import { PLANS, priceForPeriod } from "./src/pricing.js";
    import { formatPrice } from "./src/cart.js";

    const plans = document.getElementById("plans");
    const billingPeriodOptions = document.querySelectorAll('input[name="billing-period"]');

    function renderPlans(period) {
      const periodLabel = period === "yearly" ? "year" : "month";
      plans.innerHTML = PLANS.map(plan => `<div class="card"><h2>${plan.name}</h2><p class="price">${formatPrice(priceForPeriod(plan, period))} <small>/ ${periodLabel}</small></p></div>`).join("");
    }

    renderPlans("monthly");
    billingPeriodOptions.forEach(option => {
      option.addEventListener("change", () => {
        if (option.checked) renderPlans(option.value);
      });
    });
  </script>
</body>
</html>
