<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pricing · Plannr</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><a href="index.html">Plannr</a><a href="tasks.html">Tasks</a><a href="pricing.html">Pricing</a><a href="settings.html">Settings</a><a href="signup.html">Sign up</a><a href="cart.html">Cart</a></header>
  <main>
    <h1>Pricing</h1>
    <div class="billing-toggle" role="group" aria-label="Billing period">
      <button class="button secondary" type="button" data-period="monthly" aria-pressed="true">Monthly</button>
      <button class="button secondary" type="button" data-period="yearly" aria-pressed="false">Yearly</button>
    </div>
    <div id="plans"></div>
  </main>
  <script type="module">
    import { PLANS, priceForPeriod } from "./src/pricing.js";
    import { formatPrice } from "./src/cart.js";
    const plans = document.getElementById("plans");
    const periodButtons = [...document.querySelectorAll("[data-period]")];
    let period = "monthly";

    function renderPlans() {
      plans.innerHTML = PLANS.map(plan => {
        const price = formatPrice(priceForPeriod(plan, period));
        const interval = period === "yearly" ? "year" : "month";
        return `<div class="card"><h2>${plan.name}</h2><p class="price">${price} <small>/ ${interval}</small></p></div>`;
      }).join("");
      periodButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.period === period));
      });
    }

    periodButtons.forEach(button => button.addEventListener("click", () => {
      period = button.dataset.period;
      renderPlans();
    }));
    renderPlans();
  </script>
</body>
</html>
